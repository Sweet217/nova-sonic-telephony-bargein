[project]
name = "nova-sonic-telephony-bargein"
version = "0.1.0"
description = "Telephony bridge (Twilio Media Streams <-> Amazon Nova 2 Sonic) with client-side barge-in and an echo guard, plus a reproducible PSTN echo testbed."
authors = [{ name = "Gabriel Velázquez" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "websockets>=13"]

[project.optional-dependencies]
testbed = ["scipy>=1.13", "matplotlib>=3.8", "pytest>=8"]
nova = ["aws_sdk_bedrock_runtime==0.12.0; python_version >= '3.12'"]

[tool.setuptools]
packages = ["novabridge", "testbed", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
